<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <title>Lista de Tarefas</title>
  <meta name="description" content="Lista de tarefas com categorias, busca, filtros e backup. Funciona no navegador e salva tudo no seu aparelho.">

  <!-- Prévia ao compartilhar o link (WhatsApp, redes sociais etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="Lista de Tarefas">
  <meta property="og:description" content="Organize suas tarefas por categoria, com busca, filtros e backup.">

  <!-- Ícones: aba do navegador, tela inicial do celular e instalação -->
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Tarefas">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="cabecalho">
      <p class="data-hoje" id="data-hoje"></p>
      <h1>Minhas tarefas</h1>
    </header>

    <!-- Aparece só se o navegador não deixar salvar (ex.: janela anônima) -->
    <p class="aviso" id="aviso-armazenamento" role="alert" hidden>
      Não foi possível salvar no navegador. Suas tarefas podem se perder ao fechar a página.
    </p>

    <!-- Barra de busca -->
    <div class="busca" role="search">
      <svg class="busca-icone" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M20 20l-4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <label for="campo-busca" class="visualmente-oculto">Buscar tarefas</label>
      <input
        type="search"
        id="campo-busca"
        class="campo-busca"
        placeholder="Buscar tarefas…"
        autocomplete="off"
      >
      <kbd class="busca-atalho" id="busca-atalho" title="Atalho: tecla /">/</kbd>
      <button type="button" class="botao-limpar-busca" id="botao-limpar-busca" aria-label="Limpar busca" hidden>✕</button>
    </div>

    <!-- Resumo: contador de pendentes + barra de progresso -->
    <section class="resumo" aria-live="polite">
      <div class="resumo-topo">
        <div class="resumo-contador">
          <span class="resumo-valor" id="contador">0</span>
          <span class="resumo-rotulo" id="contador-rotulo">Tarefas Pendentes</span>
        </div>
        <p class="resumo-progresso-texto" id="progresso-texto">0 de 0 concluídas</p>
      </div>
      <div class="progresso" aria-hidden="true">
        <div class="progresso-barra" id="progresso-barra"></div>
      </div>
    </section>

    <!-- Informações que só aparecem no PDF -->
    <p class="info-impressao" id="info-impressao"></p>

    <!-- Formulário para adicionar tarefa -->
    <form class="formulario" id="formulario">
      <label for="campo-tarefa" class="visualmente-oculto">Nova tarefa</label>
      <input
        type="text"
        id="campo-tarefa"
        class="campo-texto"
        placeholder="O que você precisa fazer?"
        maxlength="120"
        autocomplete="off"
        required
      >

      <label for="campo-categoria" class="visualmente-oculto">Categoria</label>
      <select id="campo-categoria" class="campo-select">
        <option value="pessoal">Pessoal</option>
        <option value="trabalho">Trabalho</option>
        <option value="estudos">Estudos</option>
        <option value="saude">Saúde</option>
        <option value="compras">Compras</option>
      </select>

      <button type="submit" class="botao-adicionar">
        <span aria-hidden="true">+</span> Adicionar
      </button>
    </form>

    <!-- Filtros por categoria (botões criados pelo JavaScript) -->
    <nav class="filtros" id="filtros" aria-label="Filtrar por categoria"></nav>

    <!-- Lista de tarefas -->
    <ul class="lista" id="lista"></ul>

    <p class="vazio" id="mensagem-vazia" hidden>Nenhuma tarefa por aqui. Adicione a primeira acima.</p>

    <!-- Confirmação da importação (aparece depois de escolher o arquivo) -->
    <section class="painel-importar" id="painel-importar" aria-labelledby="painel-importar-titulo" hidden>
      <p class="painel-importar-titulo" id="painel-importar-titulo"></p>
      <p class="painel-importar-texto">O que fazer com as tarefas que já estão na lista?</p>
      <div class="painel-importar-botoes">
        <button type="button" class="botao-secundario" id="importar-juntar">Juntar com as atuais</button>
        <button type="button" class="botao-perigo" id="importar-substituir">Substituir tudo</button>
        <button type="button" class="botao-texto" id="importar-cancelar">Cancelar</button>
      </div>
    </section>

    <footer class="rodape">
      <div class="rodape-grupo">
        <button type="button" class="botao-secundario" id="botao-exportar-backup">Exportar Backup</button>
        <button type="button" class="botao-secundario" id="botao-importar-backup">Importar Backup</button>
        <!-- Campo de arquivo escondido: o botão acima "clica" nele -->
        <input type="file" id="campo-arquivo-backup" accept=".json,application/json" hidden>
      </div>
      <div class="rodape-grupo">
        <button type="button" class="botao-limpar" id="botao-limpar">Limpar Concluídas</button>
        <button type="button" class="botao-exportar" id="botao-exportar">Exportar PDF</button>
      </div>
    </footer>

    <!-- Aviso com opção de desfazer (aparece depois de limpar) -->
    <div class="toast" id="toast" role="status" hidden>
      <span id="toast-texto"></span>
      <button type="button" class="toast-botao" id="toast-desfazer">Desfazer</button>
    </div>
  </main>
</body>
</html>
